name: Apply Pro Upgrade

on:
  push:
    paths:
      - 'scripts/apply-pro-upgrade.mjs'
      - '.github/workflows/apply-pro-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply patch
        run: node scripts/apply-pro-upgrade.mjs
      - name: Verify
        run: |
          bun install --frozen-lockfile
          bun run test --run
          bun run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete 5Dollar Pro integration"
          git push origin HEAD:main
