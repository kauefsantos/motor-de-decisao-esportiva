name: Apply Pro Continental Fixes V2

on:
  push:
    branches:
      - fix/pro-continental-pipeline
    paths:
      - .github/workflows/apply-pro-continental-fixes-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pro-continental-pipeline

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply patch script
        run: python3 scripts/apply_pro_continental_fixes.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/pipeline.server.ts src/lib/experimental-markets-run.functions.ts src/lib/elo-sync.server.ts
          git commit -m "Fix Pro continental data flow" || exit 0
          git push origin HEAD:fix/pro-continental-pipeline
