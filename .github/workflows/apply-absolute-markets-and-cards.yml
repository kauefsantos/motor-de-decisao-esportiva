name: Apply absolute markets and cards migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-absolute-markets-and-cards.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run absolute markets and cards migration'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 .github/scripts/apply_absolute_markets.py

      - name: Diff check
        run: git diff --check

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted tests
        run: bunx vitest run src/lib/engine/markets.test.ts src/lib/engine/experimental-goal-markets.test.ts src/lib/engine/cards.test.ts src/lib/engine/experimental-pilot.e2e.test.ts

      - name: Commit requested changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/markets.ts src/lib/engine/experimental-goal-markets.ts src/lib/engine/cards.ts src/lib/experimental-markets-run.functions.ts src/lib/qualified-alternates.functions.ts src/lib/auto-bet365-odds.functions.ts src/components/ExperimentalMarketsPilot.tsx src/lib/engine/markets.test.ts src/lib/engine/experimental-goal-markets.test.ts src/lib/engine/experimental-pilot.e2e.test.ts src/lib/engine/cards.test.ts src/lib/engine/opportunity.ts
          git commit -m "Use absolute markets and open yellow-card model"
          git push origin HEAD:main
