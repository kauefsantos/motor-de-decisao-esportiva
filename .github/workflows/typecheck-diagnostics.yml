name: Static diagnostics

on:
  push:
    branches: [audit/architecture-quality-20260912]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Capture lint diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee lint.log

      - name: Capture TypeScript diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee typecheck.log

      - name: Capture architecture diagnostics
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          bun run check:architecture 2>&1 | tee architecture.log

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-diagnostics
          path: |
            lint.log
            typecheck.log
            architecture.log
          if-no-files-found: error
