name: One-shot architecture refactor

on:
  push:
    branches: [audit/architecture-quality-20260912]

permissions:
  contents: write

jobs:
  split-pipeline:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/architecture-quality-20260912
          fetch-depth: 0

      - name: Apply deterministic split
        run: node scripts/one-shot-pipeline-refactor.mjs

      - name: Commit extracted stages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Refactor pipeline resolution and collection stages"
          git push origin HEAD:audit/architecture-quality-20260912
