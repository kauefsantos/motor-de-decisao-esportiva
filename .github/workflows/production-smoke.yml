name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "src/server.ts"
      - "src/lib/csp.ts"
      - "src/components/AuthGate.tsx"
      - "src/integrations/supabase/auth-middleware.ts"
      - "supabase/migrations/**"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

jobs:
  published-security-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check published private surface
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://quant-football-insights.lovable.app"
          URL="$BASE/"
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"

          if [ -z "$BROWSER" ]; then
            echo "No headless Chromium/Chrome binary is available on this runner."
            exit 1
          fi

          for attempt in $(seq 1 6); do
            echo "Production smoke attempt ${attempt}/6"

            HEADER_FILE="$(mktemp)"
            BODY_FILE="$(mktemp)"
            ROOT_STATUS="$(curl -sS -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' "$URL" || true)"
            HEADERS="$(cat "$HEADER_FILE")"
            BODY="$(cat "$BODY_FILE")"
            rm -f "$HEADER_FILE" "$BODY_FILE"

            API_GET_STATUS="$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/api/elo-sync" || true)"
            ROBOTS="$(curl -fsS "$BASE/robots.txt" || true)"

            echo "Published security headers:"
            grep -iE '^(content-security-policy|cross-origin-resource-policy|cross-origin-opener-policy|permissions-policy|x-content-type-options|referrer-policy|x-robots-tag|cache-control|strict-transport-security):' <<<"$HEADERS" || true

            DOM="$($BROWSER \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=10000 \
              --dump-dom \
              "$URL" 2>/dev/null || true)"

            login_ok=false
            headers_ok=false
            nonce_ok=false
            endpoint_ok=false
            robots_ok=false
            cache_ok=false
            referrer_ok=false

            if ! grep -q "Esta página não carregou" <<<"$DOM" \
              && grep -q "Acesso privado" <<<"$DOM" \
              && grep -q "Entrar com Google" <<<"$DOM"; then
              login_ok=true
            fi

            if { grep -qi '^cache-control: .*no-store' <<<"$HEADERS" \
              || grep -qi '^cache-control: .*no-cache' <<<"$HEADERS"; } \
              && grep -qi '^cache-control: .*max-age=0' <<<"$HEADERS" \
              && ! grep -qi '^cache-control: .*public' <<<"$HEADERS"; then
              cache_ok=true
            fi

            if grep -qiE '^referrer-policy: (no-referrer|strict-origin-when-cross-origin)' <<<"$HEADERS"; then
              referrer_ok=true
            fi

            CSP="$(grep -i '^content-security-policy:' <<<"$HEADERS" | head -n1 | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r')"
            NONCE="$(sed -n "s/.*script-src[^;]*'nonce-\([^']*\)'.*/\1/p" <<<"$CSP")"
            if [ -n "$NONCE" ] \
              && grep -Fq "style-src 'self' 'nonce-$NONCE'" <<<"$CSP" \
              && grep -Fq "nonce=\"$NONCE\"" <<<"$BODY"; then
              nonce_ok=true
            fi

            if grep -qi '^x-content-type-options: nosniff' <<<"$HEADERS" \
              && grep -qi '^x-robots-tag: noindex, nofollow, noarchive' <<<"$HEADERS" \
              && grep -qi '^cross-origin-resource-policy: same-origin' <<<"$HEADERS" \
              && grep -qi '^cross-origin-opener-policy: same-origin-allow-popups' <<<"$HEADERS" \
              && grep -qi '^permissions-policy: .*camera=()' <<<"$HEADERS" \
              && grep -Fq "default-src 'self'" <<<"$CSP" \
              && grep -Fq "base-uri 'none'" <<<"$CSP" \
              && grep -Fq "object-src 'none'" <<<"$CSP" \
              && grep -Fq "script-src-attr 'none'" <<<"$CSP" \
              && grep -Fq "style-src-attr 'none'" <<<"$CSP" \
              && ! grep -Fq "'unsafe-inline'" <<<"$CSP" \
              && ! grep -Fq "'unsafe-eval'" <<<"$CSP" \
              && [ "$nonce_ok" = true ] \
              && [ "$cache_ok" = true ] \
              && [ "$referrer_ok" = true ]; then
              headers_ok=true
            fi

            if [ "$API_GET_STATUS" = "405" ]; then
              endpoint_ok=true
            fi

            if grep -qi '^User-agent: \*$' <<<"$ROBOTS" \
              && grep -qi '^Disallow: /$' <<<"$ROBOTS"; then
              robots_ok=true
            fi

            if [ "$ROOT_STATUS" = "200" ] \
              && [ "$login_ok" = true ] \
              && [ "$headers_ok" = true ] \
              && [ "$endpoint_ok" = true ] \
              && [ "$robots_ok" = true ]; then
              echo "Published app passed private-access, nonce-CSP and hardened security smoke checks."
              exit 0
            fi

            echo "Current checks: root=$ROOT_STATUS login=$login_ok headers=$headers_ok nonce=$nonce_ok api_get=$API_GET_STATUS robots=$robots_ok"
            sleep 10
          done

          echo "Published app failed one or more security smoke checks."
          exit 1
