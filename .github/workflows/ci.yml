name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Full history is required so Gitleaks can detect credentials that were
          # committed and later deleted, not only secrets in the current tree.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency remediation preview
        shell: bash
        run: |
          set -euo pipefail
          bun audit fix
          echo "Automatic security remediation diff:"
          git diff -- package.json bun.lock

      - name: Dependency vulnerability gate
        run: bun audit --audit-level=high

      - name: Repository secret scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner --config=/repo/.gitleaks.toml /repo

      - name: Server secret boundary
        shell: bash
        run: |
          set -euo pipefail

          service_role_hits="$(grep -RIl --exclude='client.server.ts' 'SUPABASE_SERVICE_ROLE_KEY' src || true)"
          if [ -n "$service_role_hits" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY must only appear in src/integrations/supabase/client.server.ts"
            echo "$service_role_hits"
            exit 1
          fi

          static_admin_imports="$(
            find src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.server.ts' -print0 \
              | xargs -0 grep -IlE '^[[:space:]]*(import[[:space:]].*client\.server|.*from[[:space:]]+["'"'"']@/integrations/supabase/client\.server["'"'"'])' \
              || true
          )"
          if [ -n "$static_admin_imports" ]; then
            echo "Static imports of the service-role client are forbidden outside *.server.ts modules."
            echo "$static_admin_imports"
            exit 1
          fi

      - name: Functional decision-flow E2E
        run: bunx vitest run src/functional-decision-flow.e2e.test.ts

      - name: Experimental engine E2E
        run: bunx vitest run src/lib/engine/experimental-pilot.e2e.test.ts

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build
