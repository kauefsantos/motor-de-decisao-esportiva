name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Apply total cards migration
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run total cards migration'
        run: python3 .github/scripts/apply_total_cards.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Experimental engine E2E
        run: bunx vitest run src/lib/engine/experimental-pilot.e2e.test.ts

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Commit total cards migration
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run total cards migration'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/engine/markets.ts src/lib/engine/cards.ts src/components/ExperimentalMarketsPilot.tsx src/lib/experimental-markets-run.functions.ts src/lib/engine/cards.test.ts
          git commit -m "Model Bet365 cards as yellow plus red"
          git push origin HEAD:main
