name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Static security checks
        run: node scripts/security-check.mjs

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Experimental engine E2E
        run: bunx vitest run src/lib/engine/experimental-pilot.e2e.test.ts

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Visitor SSR and security-header smoke
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/value-bet-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          status=000
          for _ in $(seq 1 30); do
            status=$(curl -sS -D /tmp/value-bet-headers.txt -o /tmp/value-bet-home.html -w '%{http_code}' http://127.0.0.1:4173/ || true)
            [ "$status" = "200" ] && break
            sleep 1
          done

          if [ "$status" != "200" ]; then
            cat /tmp/value-bet-preview.log
            echo "Preview did not become healthy (HTTP $status)."
            exit 1
          fi

          grep -Eq 'Verificando acesso|Acesso privado' /tmp/value-bet-home.html
          grep -qi '^content-security-policy:' /tmp/value-bet-headers.txt
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' /tmp/value-bet-headers.txt
          grep -qi '^permissions-policy:' /tmp/value-bet-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/value-bet-headers.txt

          legacy_status=$(curl -sS -o /tmp/value-bet-legacy-route.txt -w '%{http_code}' http://127.0.0.1:4173/api/elo-sync || true)
          if [ "$legacy_status" != "404" ]; then
            echo "Legacy /api/elo-sync must be absent; got HTTP $legacy_status."
            cat /tmp/value-bet-legacy-route.txt
            exit 1
          fi
