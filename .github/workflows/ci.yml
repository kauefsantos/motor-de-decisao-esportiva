name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Experimental engine E2E
        run: bunx vitest run src/lib/engine/experimental-pilot.e2e.test.ts

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build
