name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.100.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency vulnerability gate
        run: bun audit --audit-level=high

      - name: Repository secret scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --redact --no-banner --config=/repo/.gitleaks.toml /repo

      - name: Server secret boundary
        shell: bash
        run: |
          set -euo pipefail
          service_role_hits="$(grep -RIl --exclude='client.server.ts' 'SUPABASE_SERVICE_ROLE_KEY' src || true)"
          if [ -n "$service_role_hits" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY must only appear in src/integrations/supabase/client.server.ts"
            echo "$service_role_hits"
            exit 1
          fi
          static_admin_imports="$(find src -type f \( -name '*.ts' -o -name '*.tsx' \) ! -name '*.server.ts' -print0 | xargs -0 grep -IlE '^[[:space:]]*(import[[:space:]].*client\.server|.*from[[:space:]]+["'"'"']@/integrations/supabase/client\.server["'"'"'])' || true)"
          if [ -n "$static_admin_imports" ]; then
            echo "Static imports of the service-role client are forbidden outside *.server.ts modules."
            echo "$static_admin_imports"
            exit 1
          fi

      - name: Governance documentation gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD^"
          fi
          changed="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only HEAD^ HEAD)"
          protected="$(printf '%s\n' "$changed" | grep -E '^(supabase/migrations/|src/lib/engine/|src/lib/adapters/|src/lib/(authorization|bankroll|analytics|privacy|lovable-error-reporting)|src/components/(AuthGate|AppShell)|src/routes/(privacidade|conta)|\.github/workflows/)' || true)"
          if [ -n "$protected" ]; then
            docs="$(printf '%s\n' "$changed" | grep -E '^docs/(PROJECT_STATE\.md|GOVERNANCE\.md|METRICS_GLOSSARY\.md|DATA_CATALOG\.md|PRIVACY\.md|PRIVACY_DATA_REGISTER\.md|governance/)' || true)"
            if [ -z "$docs" ]; then
              echo "Governed code changed without canonical governance/documentation update."
              echo "$protected"
              exit 1
            fi
          fi

          privacy_sensitive="$(printf '%s\n' "$changed" | grep -E '^(src/lib/privacy|src/lib/lovable-error-reporting|src/components/AuthGate|src/routes/(privacidade|conta)|supabase/migrations/.*privacy)' || true)"
          if [ -n "$privacy_sensitive" ]; then
            privacy_docs="$(printf '%s\n' "$changed" | grep -E '^docs/(PRIVACY\.md|PRIVACY_DATA_REGISTER\.md)$' || true)"
            if [ -z "$privacy_docs" ]; then
              echo "Privacy-sensitive code changed without privacy documentation update."
              exit 1
            fi
          fi

      - name: Versioned route tree gate
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r file; do
            base="$(basename "$file")"
            base="${base%.tsx}"
            base="${base%.ts}"
            [ "$base" = "__root" ] && continue
            if ! grep -Fq "from './routes/$base'" src/routeTree.gen.ts; then
              echo "Route missing from committed src/routeTree.gen.ts: $file"
              missing=1
            fi
          done < <(find src/routes -maxdepth 1 -type f \( -name '*.ts' -o -name '*.tsx' \) | sort)
          if [ "$missing" -ne 0 ]; then
            echo "Regenerate and commit src/routeTree.gen.ts before merging."
            exit 1
          fi

      - name: Database migrations and regression tests
        run: |
          supabase db start
          supabase test db

      - name: Functional decision-flow E2E
        run: bunx vitest run src/functional-decision-flow.e2e.test.ts

      - name: Experimental engine E2E
        run: bunx vitest run src/lib/engine/experimental-pilot.e2e.test.ts

      - name: Unit tests
        run: bunx vitest run

      - name: Build
        run: bun run build

      - name: Client bundle performance budget
        run: bun scripts/check-performance-budget.mjs

      - name: Concurrent HTTP load smoke
        run: bun scripts/load-smoke.mjs

  browser-compatibility:
    name: Browser compatibility and accessibility
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install browser and accessibility test runners
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.63.0 @axe-core/playwright@4.10.2

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Responsive, accessibility and performance browser matrix
        run: npx playwright test
