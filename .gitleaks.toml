title = "Motor de Decisão Esportiva secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Supabase publishable keys are public client identifiers by design"
regexTarget = "line"
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+'''
]

[[allowlists]]
targetRules = ["generic-api-key"]
description = "The documented cron secret placeholders are both intentionally empty"
regexTarget = "match"
regexes = [
  '''LOVABLE_CRON_SECRET=""\s+LOVABLE_CRON_SECRET_PREVIOUS=""'''
]
