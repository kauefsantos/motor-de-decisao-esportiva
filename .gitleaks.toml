title = "Motor de Decisão Esportiva secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Supabase publishable keys are public client identifiers by design"
regexTarget = "line"
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+'''
]

[[allowlists]]
description = "Empty documented secret placeholders are not credentials"
regexTarget = "line"
regexes = [
  '''^LOVABLE_CRON_SECRET(?:_PREVIOUS)?=""$'''
]
